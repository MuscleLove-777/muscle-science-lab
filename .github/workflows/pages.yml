name: Deploy static site to Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Ensure robots.txt
        run: |
          mkdir -p output/site
          cat > output/site/robots.txt <<'EOF'
          User-agent: *
          Allow: /
          Sitemap: https://musclelove-777.github.io/muscle-science-lab/sitemap.xml
          EOF
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./output/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
